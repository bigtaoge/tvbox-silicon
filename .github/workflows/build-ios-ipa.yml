# 【中文说明】影匣Pro - 用 GitHub Actions 打包未签名 IPA
# 用法：Fork 原仓库（建议 Public）-> 把本文件放进 fork 的
# .github/workflows/build-ios-ipa.yml -> commit 并 push ->
# GitHub 页面 Actions -> Build unsigned iOS IPA -> Run workflow ->
# 跑完在页面底部 Artifacts 下载 YingxiaPro-unsigned-ipa，解压得 IPA。
# IPA 未签名不能直装，用 cider / Sideloadly 以你自己的 Apple
# 账号签名后再装（免费账号 7 天，cider refresh run 续签）。
# 第一次跑很久（要现编嵌入式 JVM），下面英文注释是同一份说明。
# =====================================================================
# 影匣Pro (bigtaoge/tvbox-silicon) - GitHub Actions: build unsigned iOS IPA
# =====================================================================
# How to use (no need to install Xcode/JDK/Maven on your own Mac):
#   1. Fork the upstream repo to your own GitHub account.
#      Prefer a Public fork: standard Actions runners are free for
#      public repos; macOS runners on private repos are billed at
#      10x minutes and run out fast.
#   2. Put this file in your fork at exactly this path:
#          .github/workflows/build-ios-ipa.yml
#      Commit and push it to main.
#   3. On GitHub: Actions -> "Build unsigned iOS IPA" ->
#      Run workflow -> Run workflow.
#   4. When it finishes, download the IPA from the repo's
#      Releases page (it is published there on every run), or
#      from the Artifact named YingxiaPro-unsigned-ipa at the
#      bottom of that run page (kept 7 days) and unzip it to
#      get YingxiaPro-unsigned.ipa.
#   5. The IPA is UNSIGNED and cannot be installed as-is.
#      Sign it on your own computer with your own Apple account,
#      e.g. with cider or Sideloadly:
#          cider sign YingxiaPro-unsigned.ipa --apple-id --install --refresh
#      A free account signing lasts 7 days; renew with
#      "cider refresh run" and do not delete the app first,
#      or subscriptions / favorites / history will be lost.
#
# Honest warnings:
#   - Upstream has no .github/workflows at all. This file follows
#     the real order in Docs/DEVELOPMENT.md and
#     Scripts/testflight-upload.sh; it is not an official workflow.
#   - The first run is slow. The heaviest step is
#     Scripts/package-apple-runtime.sh ios, which compiles the
#     embedded JVM (OpenJDK Zero + Unicorn + libffi) from source,
#     plus FFmpeg / libass / Python. 1-3 hours on the first run
#     is possible, and it may hit runner disk/time limits.
#     Caches below make later runs much faster. If the first run
#     fails inside the JVM step, it is usually disk/time, not
#     a mistake in your own changes.
#   - Do NOT put an Apple ID, password, .p12 certificate or .p8
#     key into this workflow. A free-account certificate cannot
#     sign in CI in a useful way; keep signing local.
#   - iOS only (iPhone/iPad), no tvOS/macOS. Version and build
#     come from project.yml as-is (currently 1.8.26 / 64).

name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build type (choose Release for sideload testing)"
        type: choice
        options:
          - Release
          - Debug
        default: Release
        required: true

permissions:
  # write is needed so the run can publish the IPA to Releases
  # (softprops/action-gh-release below). Nothing else in the
  # workflow writes to the repo.
  contents: write

concurrency:
  group: build-ios-ipa
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build TVBox-iOS (unsigned)
    # macOS runner is required for Xcode. Use macos-latest
    # (its default Xcode varies by image date — currently 26.x or 27.x).
    # AetherEngine 7.76.0 requires Xcode 27.0, so the "Select Xcode 27"
    # step below pins 27 explicitly instead of assuming the default.
    # Upstream code has been patched for the new Xcode in
    # xcode26-compat.patch (see README there). Do NOT switch back
    # to macos-15: that only hides the incompatibility.
    runs-on: macos-latest
    # 360 is the maximum for a GitHub-hosted runner job.
    timeout-minutes: 360
    env:
      SCHEME: TVBox-iOS
      CONFIGURATION: ${{ inputs.configuration }}
      JOBS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and disk
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          df -h
          sw_vers

      # AetherEngine 7.76.0 requires Xcode 27.0 / Swift 6.4 (docs/installation.md).
      # macos-latest's default Xcode depends on the image date (26.x or 27.x),
      # so pick 27 explicitly instead of assuming it. If no Xcode 27 is on the
      # image, fail here with a clear message rather than wasting the run on
      # an SPM resolution error later.
      - name: Select Xcode 27 (AetherEngine requires Xcode 27.0)
        run: |
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none found under /Applications)"
          DEFAULT_MAJOR="$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)"
          if [ "$DEFAULT_MAJOR" = "27" ]; then
            echo "Default Xcode is already 27.x, keeping it."
          else
            XCODE27="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -v -i beta | head -1 || true)"
            if [ -z "$XCODE27" ]; then
              XCODE27="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | head -1 || true)"
              [ -n "$XCODE27" ] && echo "Note: only a beta Xcode 27 is available ($XCODE27), using it."
            fi
            if [ -z "$XCODE27" ]; then
              echo "::error::No Xcode 27 found on this runner (default is Xcode $DEFAULT_MAJOR). AetherEngine 7.76.0 requires Xcode 27.0 / Swift 6.4. Re-run on a runner image that ships Xcode 27 (e.g. the macOS 27 image)."
              exit 1
            fi
            echo "Switching to $XCODE27"
            sudo xcode-select -s "$XCODE27/Contents/Developer"
          fi
          xcodebuild -version
          test "$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)" = "27"

      # build-java-host.sh needs JDK 19. It reads $JAVA_HOME
      # first and only falls back to /usr/libexec/java_home -v 19,
      # so setting JAVA_HOME via setup-java is enough.
      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "19"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # xcodegen: generates TVBox.xcodeproj from project.yml
      # maven: build-java-host.sh needs mvn on PATH
      # python@3.14: build-apple-python.sh requires python3.14
      # autoconf (+ automake): the embedded-JVM step runs OpenJDK's
      # configure, which needs autoconf to generate its runnable
      # configure script. Without it that step fails with
      # "Error: Cannot find autoconf" (first run, 2026-11-20).
      - name: Install build tools (Homebrew)
        run: |
          brew install xcodegen maven python@3.14 autoconf automake
          xcodegen --version
          mvn -version
          python3.14 --version
          autoconf --version | head -1
          echo "$(brew --prefix python@3.14)/bin" >> "$GITHUB_PATH"

      # ---- Caches: the first run is slow mainly because of these ----
      - name: Cache FFmpeg build
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/tvbox-ffmpeg
          key: tvbox-ffmpeg-${{ runner.os }}-${{ hashFiles('Scripts/build-apple-ffmpeg.sh') }}

      - name: Cache libass build
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/tvbox-libass
          key: tvbox-libass-${{ runner.os }}-${{ hashFiles('Scripts/build-apple-libass.sh') }}

      - name: Cache NodeMobile download
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/tvbox-nodejs-mobile
          key: tvbox-nodejs-mobile-${{ runner.os }}-${{ hashFiles('Scripts/fetch-node-mobile.sh') }}

      # The embedded JVM is the heaviest part; cache it separately.
      # If the cache is evicted, the build simply recompiles it.
      - name: Cache Apple runtime (embedded JVM)
        uses: actions/cache@v4
        with:
          path: |
            build/apple-runtime
            build/AppleRuntime
          key: tvbox-apple-runtime-ios-${{ runner.os }}-${{ hashFiles('Scripts/build-apple-jvm.sh', 'Scripts/package-apple-runtime.sh', 'Scripts/build-apple-interpreter.sh', 'Scripts/build-apple-libffi.sh', 'Scripts/build-apple-native-bindings.sh', 'Runtime/AppleRuntime/runtime-version') }}

      # ---- Prepare runtimes, in Docs/DEVELOPMENT.md order ----
      # build-script-host.sh / build-python-host.sh are only needed
      # by the macOS target, so they are intentionally skipped here.

      - name: Build Java host
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          Scripts/build-java-host.sh
          test -f build/JavaHost/host.jar

      # Produces build/AppleRuntime/iphoneos/lib/libTVAppleRuntime.a
      # The TVBox-iOS Xcode build phase tests for that file, so
      # Archive fails without it. This step must not be skipped
      # or moved after the Archive step. Internally it runs
      # build-apple-jvm.sh ios and build-apple-native-bindings.sh
      # ios, then syncs the Java host (sync-apple-javahost.sh).
      - name: Package Apple runtime for iOS (embedded JVM)
        run: |
          Scripts/package-apple-runtime.sh ios
          test -f build/AppleRuntime/iphoneos/lib/libTVAppleRuntime.a
          test -f build/AppleRuntime/iphoneos/Resources/JavaHost/host.jar

      # Without this the app still builds, but Python sources
      # will not run, so it is kept by default.
      - name: Build Apple Python for iOS
        run: |
          export HOST_PYTHON="$(command -v python3.14)"
          Scripts/build-apple-python.sh ios
          test -d build/ApplePython/iphoneos

      - name: Build FFmpeg
        run: Scripts/build-apple-ffmpeg.sh

      - name: Build libass
        run: Scripts/build-apple-libass.sh

      # These two are Mac-only resources, but xcodegen validates ALL
      # targets (including TVBox-macOS, which lists build/ScriptHost
      # and build/PythonHost as source dirs in project.yml), so they
      # must exist before "xcodegen generate" or it fails with
      # "Target TVBox-macOS has a missing source directory"
      # (failed run, 2026-11-20). The iOS archive itself does not
      # use them.
      - name: Build script host (for xcodegen validation)
        run: Scripts/build-script-host.sh

      - name: Build Python host (for xcodegen validation)
        run: Scripts/build-python-host.sh

      - name: Generate Xcode project
        run: xcodegen generate

      # ---- Archive with signing disabled ----
      # No DEVELOPMENT_TEAM, no upstream team WWNM49L69R, no
      # App Store certificate/profile: those are the upstream
      # author's private signing material and will not work in
      # a fork. Signing happens locally afterwards.
      - name: Archive TVBox-iOS (unsigned)
        run: |
          mkdir -p build/ci
          # pipefail: without it, "xcodebuild ... | tee archive.log"
          # returns tee's exit code, so a failed archive would look
          # successful and only fail later in Verify archive with no
          # .app and no error message (failed run, 2026-11-20).
          set -o pipefail
          xcodebuild archive \
            -project TVBox.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "build/ci/TVBox-iOS.xcarchive" \
            -derivedDataPath "build/ci/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build/ci/archive.log

      # Same sanity checks as Scripts/testflight-upload.sh:
      # bundle id must be com.bigtaoge.yingxiapro.ios and the main
      # binary must export _JIMAGE_Open, otherwise the embedded
      # JVM crashes the first time a Java source starts.
      - name: Verify archive
        run: |
          APP="build/ci/TVBox-iOS.xcarchive/Products/Applications/TVBox-iOS.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = "com.bigtaoge.yingxiapro.ios"
          nm -gU "$APP/TVBox-iOS" | grep ' _JIMAGE_Open$'

      # An unsigned IPA is just Payload/*.app zipped, renamed .ipa
      - name: Package unsigned IPA
        run: |
          APP="build/ci/TVBox-iOS.xcarchive/Products/Applications/TVBox-iOS.app"
          rm -rf build/ci/Payload build/ci/YingxiaPro-unsigned.ipa
          mkdir -p build/ci/Payload
          cp -R "$APP" build/ci/Payload/
          cd build/ci
          zip -qry YingxiaPro-unsigned.ipa Payload
          ls -lh YingxiaPro-unsigned.ipa
          unzip -l YingxiaPro-unsigned.ipa | head -20

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: YingxiaPro-unsigned-ipa
          path: build/ci/YingxiaPro-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      # Artifacts expire after 7 days and never show in Releases,
      # so also publish the IPA as a (pre)release: one per run,
      # tagged ios-build-<run number>, kept permanently.
      - name: Publish IPA to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: iOS build #${{ github.run_number }}
          body: |
            未签名 IPA，自行签名后安装。
            Unsigned IPA from manual run #${{ github.run_number }}; sign it yourself before installing.
          prerelease: true
          files: build/ci/YingxiaPro-unsigned.ipa

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/ci/archive.log
          if-no-files-found: ignore
          retention-days: 7
